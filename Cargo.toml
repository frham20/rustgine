[package]
name = "rustgine"
version = "0.1.0"
edition = "2021"
description = "A Rust and Direct3D 12 deferred renderer"

[dependencies]
glam = "0.30"
imgui = "0.12"
windows = { version = "0.58", features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security",
    "Win32_UI_HiDpi", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
] }
